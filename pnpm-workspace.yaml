packages:
  - "apps/*"
  - "packages/*"
supportedArchitectures:
  os:
    - darwin
    - win32
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
allowBuilds:
  '@google/genai': true
  '@vscode/vsce-sign': true
  electron-winstaller: false
  esbuild: true
  get-windows: true
  keytar: true
  koffi: true
  protobufjs: true
  sharp: true
